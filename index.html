<!-- Piper (on-device voice) imports "onnxruntime-web/wasm" and expects the 1.18.0 engine files, so pin exactly that. -->
<script type="importmap">{"imports":{"onnxruntime-web/wasm":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js"}}</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-italic.woff2) format("woff2");font-weight:200 1000;font-style:italic;font-display:swap}
/* Tropical: mango, flamenco, mar, palma, noche on a warm peach ground. Hard shadows make things look pressable. */
:root{
  --bg:#FFE9C9; --paper:#FFFFFF; --sunk:#FFF6E8; --ink:#12302A; --muted:#4F6A61; --line:#F2D3A8; --edge:#12302A;
  --accent:#FF5A36; --accent-ink:#C93A18; --sea:#00B4C6; --sea-soft:#D4F4F7;
  --good:#00A67E; --on-good:#FFFFFF; --good-soft:#D2F3E8; --again:#E8364F; --again-soft:#FFD6DA;
  --s1:#FF5A8C; --s2:#FF9F1C; --s3:#00B4C6; --s4:#00A67E; --s5:#7B3FE4;
  --m-ind:#007F8C; --m-ind-soft:#D6F2F4; --m-sub:#6A33D1; --m-sub-soft:#ECE3FF; --m-imp:#C2410C; --m-imp-soft:#FFE6D5; --on-m:#FFFFFF;
  --disp:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --sans:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E2A28; --paper:#163B37; --sunk:#12332F; --ink:#FFF1DE; --muted:#A5C7BD; --line:#285A54; --edge:#051412;
  --accent:#FF6B47; --accent-ink:#FF9474; --sea:#2FD0E0; --sea-soft:#134A4E;
  --good:#2BC79A; --on-good:#062019; --good-soft:#123F33; --again:#FF6275; --again-soft:#4A1C24;
  --s1:#FF6F9C; --s2:#FFAE3D; --s3:#22C8D8; --s4:#22BD8E; --s5:#9A6BFF;
  --m-ind:#2FD0E0; --m-ind-soft:#134A4E; --m-sub:#B39BFF; --m-sub-soft:#2E2A55; --m-imp:#FFA25E; --m-imp-soft:#4A2E1C; --on-m:#062019;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E2A28; --paper:#163B37; --sunk:#12332F; --ink:#FFF1DE; --muted:#A5C7BD; --line:#285A54; --edge:#051412;
  --accent:#FF6B47; --accent-ink:#FF9474; --sea:#2FD0E0; --sea-soft:#134A4E;
  --good:#2BC79A; --on-good:#062019; --good-soft:#123F33; --again:#FF6275; --again-soft:#4A1C24;
  --s1:#FF6F9C; --s2:#FFAE3D; --s3:#22C8D8; --s4:#22BD8E; --s5:#9A6BFF;
  --m-ind:#2FD0E0; --m-ind-soft:#134A4E; --m-sub:#B39BFF; --m-sub-soft:#2E2A55; --m-imp:#FFA25E; --m-imp-soft:#4A2E1C; --on-m:#062019;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
input{font:inherit;color:inherit}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px;gap:8px}
.top .t{font-family:var(--disp);font-size:22px}
.top .sub{display:inline-block;background:var(--s5);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px}
.top .sub:empty{display:none}
.tb{white-space:nowrap;padding:10px 12px;border-radius:12px;color:var(--accent-ink);font-weight:800}
.tb:disabled{color:var(--muted);opacity:.5}
.brand{font-family:var(--disp);font-size:52px;line-height:1;margin:14px 0 6px;color:var(--accent);text-shadow:3px 3px 0 var(--edge)}
.brand b{font-weight:400;color:var(--sea)}
.lede{color:var(--muted);font-size:17px;margin-bottom:18px;max-width:34ch}
.lede strong{color:var(--ink);font-weight:800}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:150px;margin:6px 0 4px}
.tile{position:relative;height:100%;background:var(--sunk);border:2px solid var(--edge);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0;transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile:disabled{opacity:.55}
.tile .fill{width:100%;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.ladder .tile:nth-child(1) .fill{background:var(--s1)}
.ladder .tile:nth-child(2) .fill{background:var(--s2)}
.ladder .tile:nth-child(3) .fill{background:var(--s3)}
.ladder .tile:nth-child(4) .fill{background:var(--s4)}
.ladder .tile:nth-child(5) .fill{background:var(--s5)}
.tile .n{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:22px;z-index:1}
.link{color:var(--accent-ink);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--s2);text-underline-offset:3px;padding:0}
.link:disabled{color:var(--muted);text-decoration:none}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:700;margin-bottom:6px}
.legend span{display:block}
.legend .s{color:var(--ink);font-family:var(--disp);font-size:15px;font-weight:400}
.newline{color:var(--muted);font-size:14px;margin-bottom:20px}

.cta{display:block;width:100%;padding:17px;border-radius:var(--r);background:var(--accent);color:#fff;font-family:var(--disp);font-size:22px;letter-spacing:.01em;text-align:center;margin-bottom:18px;box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.cta.quiet{background:var(--paper);color:var(--ink);border:2px solid var(--edge)}
.cta:disabled{opacity:.5;transform:none;box-shadow:0 5px 0 var(--edge)}

.menu{background:var(--paper);border:2px solid var(--edge);border-radius:var(--r);overflow:hidden;margin-bottom:18px;box-shadow:0 4px 0 var(--edge)}
.menu>button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:15px 16px;text-align:left;border-top:1.5px solid var(--line);font-weight:700}
.menu>button:first-child{border-top:0}
.menu>button:active{background:var(--sunk)}
.menu>button>span{flex:1;min-width:0}
.menu>button small{color:var(--muted);display:block;font-size:13px;font-weight:500;margin-top:2px}
.menu>button::after{content:"›";color:var(--accent);font-size:24px;font-weight:800;line-height:1;margin-left:12px}
.note{background:var(--sea-soft);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:16px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:auto;padding-top:20px}

/* study */
.stages{display:flex;gap:6px;align-items:center;margin:4px 0 12px}
.stages i{width:14px;height:14px;border-radius:5px;border:2px solid var(--edge);background:var(--paper);display:block}
.stages i:nth-child(1).on{background:var(--s1)}
.stages i:nth-child(2).on{background:var(--s2)}
.stages i:nth-child(3).on{background:var(--s3)}
.stages i:nth-child(4).on{background:var(--s4)}
.stages i:nth-child(5).on{background:var(--s5)}
.stages span{margin-left:8px;font-size:14px;font-weight:700;color:var(--muted)}
.card{flex:1;background:var(--paper);border:2.5px solid var(--edge);border-radius:28px;box-shadow:0 6px 0 var(--edge);padding:28px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;min-height:300px}
.card .k{color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.02em;margin-bottom:14px}
.word{font-family:var(--disp);font-size:40px;line-height:1.1;overflow-wrap:anywhere}
.word.sm{font-family:var(--sans);font-weight:800;font-size:26px}
.ex{font-size:18px;color:var(--muted);margin-top:14px;font-style:italic;line-height:1.4;max-width:32ch}
.notes{font-size:14px;color:var(--muted);margin-top:12px;max-width:34ch}
.answer{margin-top:22px;padding-top:22px;border-top:2.5px dashed var(--line);width:100%;display:flex;flex-direction:column;align-items:center}
.speak{margin-top:14px;width:48px;height:48px;border-radius:24px;background:var(--sea);color:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--edge)}
.speak:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.verdict{margin-top:14px;padding:8px 16px;border-radius:999px;font-size:15px;font-weight:800}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.near{background:var(--s2);color:#12302A}
.verdict.no{background:var(--again-soft);color:var(--again)}
.typed{color:var(--muted);font-size:15px;margin-top:6px}
.typed s{color:var(--again)}
.typein{width:100%;margin-top:22px;display:flex;gap:8px}
.typein input{flex:1;min-width:0;font-size:22px;font-weight:700;padding:14px 16px;border:2.5px solid var(--edge);border-radius:18px;background:var(--sunk);color:var(--ink)}
.typein input::placeholder{color:var(--muted);opacity:.7}
.typein button{padding:0 18px;border-radius:18px;background:var(--sea);color:#fff;font-family:var(--disp);font-size:18px;box-shadow:0 3px 0 var(--edge)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions .one{grid-column:1/-1}
.big{padding:16px 12px;border-radius:var(--r);font-family:var(--disp);font-size:22px;letter-spacing:.01em;background:var(--paper);box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.big.again{background:var(--again-soft);color:var(--again)}
.big.good{background:var(--good);color:var(--on-good)}
.big.primary{background:var(--accent);color:#fff}
.big small{display:block;font-family:var(--sans);font-weight:700;font-size:13px;opacity:.85;margin-top:2px;letter-spacing:0}
.drop{display:block;width:100%;text-align:center;color:var(--muted);font-size:14px;font-weight:700;padding:14px 12px 4px}
.card.tap{cursor:pointer;transition:transform .1s}
.card.tap:active{transform:scale(.985)}
.taphint{color:var(--muted);font-size:13px;font-weight:700;margin-top:22px;opacity:.8}
.card.swipe{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.card.swipe.dragging{cursor:grabbing}
.stamp{position:absolute;top:18px;padding:5px 12px;border-radius:12px;border:3px solid;font-family:var(--disp);font-size:20px;opacity:0;pointer-events:none;transform:rotate(var(--r));background:var(--paper)}
.stamp.yes{left:18px;color:var(--good);border-color:var(--good);--r:-12deg}
.stamp.no{right:18px;color:var(--again);border-color:var(--again);--r:12deg}
.swipehint{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:12px}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{transform:scale(1)}20%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* lists */
.row.off .es,.row.off .en{opacity:.45}
.row.off .tagline{color:var(--again);font-size:12px}
.form{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.form label{display:block;font-size:13px;font-weight:800;color:var(--muted)}
.form input{display:block;width:100%;margin-top:4px;font-size:17px;font-weight:600;padding:12px 14px;border:2px solid var(--edge);border-radius:14px;background:var(--paper);color:var(--ink)}
.form input:lang(es){font-size:19px;font-weight:700}
.form .cta{margin-top:8px;margin-bottom:0}
.search{width:100%;font-size:17px;font-weight:600;padding:12px 14px;border:2px solid var(--edge);border-radius:16px;background:var(--paper);margin-bottom:12px}
.rows{background:var(--paper);border:2px solid var(--edge);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:0 4px 0 var(--edge)}
.row{display:flex;align-items:stretch;border-top:1.5px solid var(--line)}
.rowmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 14px;text-align:left}
.rowdrop{flex:0 0 auto;align-self:center;margin-right:10px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--again);background:var(--again-soft)}
.rowdrop.back{color:var(--good);background:var(--good-soft)}
.row:first-child{border-top:0}
.row .es{font-size:18px;font-weight:800}
.row .en{color:var(--muted);font-size:14px}
.row .grow{flex:1;min-width:0}
.row .mini{display:flex;gap:3px}
.row .mini i{width:9px;height:9px;border-radius:3px;background:var(--line);display:block}
.row .mini i:nth-child(1).on{background:var(--s1)}
.row .mini i:nth-child(2).on{background:var(--s2)}
.row .mini i:nth-child(3).on{background:var(--s3)}
.row .mini i:nth-child(4).on{background:var(--s4)}
.row .mini i:nth-child(5).on{background:var(--s5)}
.detail{background:var(--paper);border:2.5px solid var(--edge);border-radius:28px;padding:24px 20px;margin-bottom:18px;box-shadow:0 5px 0 var(--edge)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;margin-top:18px}
.detail dt{color:var(--muted);font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-top:1.5px solid var(--line);font-weight:700}
.setrow>div:first-child{min-width:0}
.setrow:first-child{border-top:0}
.setrow.stack{flex-direction:column;align-items:stretch}
.setrow.stack .seg button{flex:1}
.setrow small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:14px;background:var(--sea-soft);color:var(--ink);font-size:22px;font-weight:800}
.step b{min-width:32px;text-align:center;font-family:var(--disp);font-size:20px;font-weight:400}
.seg.wide{width:100%;margin-bottom:10px}
.seg.wide button{flex:1}
.hint{color:var(--muted);font-size:13px;margin:0 4px 10px}
.seg{display:flex;background:var(--sunk);border:2px solid var(--edge);border-radius:14px;padding:3px;gap:2px}
.seg button{padding:7px 9px;white-space:nowrap;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--sea);color:#fff;font-weight:800}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;border:2px solid var(--edge)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.switch.on{background:var(--good)}
.switch.on::after{left:22px}
.danger{color:var(--again)}
.how h3{font-family:var(--disp);font-size:24px;font-weight:400;color:var(--accent-ink);margin:24px 0 6px}
.how p{color:var(--muted);margin-bottom:8px;max-width:60ch}
.how p b{color:var(--ink)}
.how .stg{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1.5px solid var(--line)}
.how .stg .stages{margin:4px 0 0}
.how .stg b{display:block;margin-bottom:2px;color:var(--ink)}
.how .stg p{font-size:15px;margin:0}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--paper);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--edge);color:#FFF1DE;font-weight:700;padding:12px 18px;border-radius:16px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);text-align:center;padding:40px 20px}

/* conjugation */
.seg.tabs{margin:2px 0 14px}
.seg.tabs button{font-size:15px;padding:9px}
.conj{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:6px;width:100%;max-width:340px;margin:16px auto 0;text-align:left}
.conj>div{padding:7px 11px;border-radius:12px;background:var(--sunk);font-size:17px;font-weight:800;overflow-wrap:anywhere;min-width:0}
.conj small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.conj .dim{opacity:.45}
.conj .blank{visibility:hidden}
.conj .ok{background:var(--good-soft)}
.conj .near{background:var(--s2);color:#12302A}
.conj .near small{color:inherit}
.conj .no{background:var(--again-soft)}
.conj s{display:block;color:var(--again);font-size:14px;font-weight:700}
.conj input{display:block;width:100%;min-width:0;font-size:18px;font-weight:700;padding:4px 0 2px;border:0;border-bottom:2px solid var(--edge);border-radius:0;background:transparent;color:var(--ink)}
.gridform{width:100%}
.gridform .big{width:100%;margin-top:14px}
/* moods: indicativo teal, subjuntivo purple, imperativo orange, on the tense switch and the study card's tense chip */
.m-ind{--m:var(--m-ind);--ms:var(--m-ind-soft)}
.m-sub{--m:var(--m-sub);--ms:var(--m-sub-soft)}
.m-imp{--m:var(--m-imp);--ms:var(--m-imp-soft)}
.tensechip{background:var(--ms,var(--sea-soft));color:var(--m,var(--ink));margin-top:10px}
.tenses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 16px}
.tenses h4{font-size:11px;font-weight:800;color:var(--m,var(--muted));text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 0;display:flex;align-items:center;gap:6px}
.tenses h4::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--m)}
.tenses h4:first-child{margin-top:0}
.tenses .s2{grid-column:span 2}
.tenses .s3{grid-column:1/-1}
.tenses button{min-width:0;padding:9px 4px;border-radius:12px;border:2px solid var(--m,var(--edge));background:var(--ms,var(--paper));font-size:13px;font-weight:800;color:var(--m,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenses button.on{background:var(--m,var(--ink));color:var(--on-m);box-shadow:0 3px 0 var(--edge)}
.tenses button.rand.on{background:var(--ink);color:var(--bg)}
.tenses .dots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
.tenses .dots i{width:8px;height:8px;border-radius:3px;background:var(--m)}
.tenses button:disabled{opacity:.35}
.tenses button.rand{margin-top:4px}
@media (max-width:350px){.tenses button{font-size:12px;padding:9px 2px}}
details.more{width:100%;margin-top:16px;text-align:center}
details.more summary{cursor:pointer;color:var(--muted);font-weight:800;font-size:14px;padding:6px}
.tname{font-size:12px;font-weight:800;color:var(--muted);margin-top:16px;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.form .forms{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:8px;margin:4px 0 8px}
.form details.more{text-align:left;margin-top:4px}
.form details.more summary{padding:6px 0}
.form .forms input{margin-top:2px;font-size:17px}
.form .forms label{font-size:12px}
.form .fl{font-size:13px;font-weight:800;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileCsv" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" hidden>
<input type="file" id="fileJson" hidden>
<script>
/* ---------- constants ---------- */
const KEY='cinco.v1';
const VERSION=32;               // keep in step with CACHE in sw.js, shown in Ajustes
const DAY=86400000, MIN=60000;
const RELEARN_GAP=5;           // cards between a miss and its retry
const MAX_IVL=120;             // days, mastered cards never sleep longer than this
const STAGES=[
  {name:'Nueva',     mode:null,    ivl:0},
  {name:'Aprender',  mode:'es-en', ivl:0,  blurb:'Conoces la palabra con las dos caras a la vista y te la preguntan más tarde en la misma sesión.'},
  {name:'Reconocer', mode:'es-en', ivl:1,  blurb:'Ves el español y recuerdas el inglés. Vuelve al día siguiente.'},
  {name:'Recordar',  mode:'en-es', ivl:3,  blurb:'Ves el inglés y dices el español en voz alta antes de mirar. Vuelve a los 3 días.'},
  {name:'Producir',  mode:'type',  ivl:7,  blurb:'Ves el inglés y escribes el español. Los acentos cuentan, pero un casi se marca en vez de fallarse. Vuelve a los 7 días.'},
  {name:'Dominada',  mode:'mixed', ivl:21, blurb:'Escribir o reconocer, al azar. Vuelve a los 21 días y luego el plazo se duplica cada vez, hasta 120 días. Un fallo la baja una etapa.'},
];
// Persons in the order of every tense column in a CSV (yo|tú|él|nosotros|vosotros|ellos).
const PERSONS=['yo','tú','él / ella / usted','nosotros','vosotros','ellos / ellas / ustedes'];
const PRONOUNS=[['yo'],['tú','tu','vos'],['él','el','ella','usted'],['nosotros','nosotras'],['vosotros','vosotras'],['ellos','ellas','ustedes']];
// Keys are CSV column names; new tenses go at the end so headerless files keep their column order.
// short labels the tense switch, where the tenses are grouped by mood.
const IMP_PERSONS=['','tú','usted','nosotros','vosotros','ustedes'];   // commands have no yo
const TENSES=[
  {k:'presente',name:'Presente',g:'ind'},{k:'preterito',name:'Pretérito',g:'ind'},{k:'imperfecto',name:'Imperfecto',g:'ind'},
  {k:'futuro',name:'Futuro',g:'ind'},{k:'condicional',name:'Condicional',g:'ind'},
  {k:'subjuntivo',name:'Presente de subjuntivo',short:'Presente',g:'sub',que:true},
  {k:'subj_imperfecto',name:'Imperfecto de subjuntivo',short:'Imperfecto',g:'sub',que:true},
  {k:'imperativo',name:'Imperativo afirmativo',short:'Afirmativo',g:'imp',persons:IMP_PERSONS},
  {k:'imperativo_negativo',name:'Imperativo negativo',short:'Negativo',g:'imp',persons:IMP_PERSONS},
  {k:'perfecto',name:'Pretérito perfecto',short:'Perfecto',g:'ind'},{k:'pluscuamperfecto',name:'Pluscuamperfecto',short:'Pluscuamp.',g:'ind'},
  {k:'futuro_perfecto',name:'Futuro perfecto',short:'Fut. perfecto',g:'ind'},{k:'condicional_perfecto',name:'Condicional perfecto',short:'Cond. perfecto',g:'ind'},
  {k:'subj_perfecto',name:'Perfecto de subjuntivo',short:'Perfecto',g:'sub',que:true},
  {k:'subj_pluscuamperfecto',name:'Pluscuamperfecto de subjuntivo',short:'Pluscuamp.',g:'sub',que:true},
];
const TENSE=Object.fromEntries(TENSES.map(t=>[t.k,t]));
const MOODS=[['ind','Indicativo'],['sub','Subjuntivo'],['imp','Imperativo']];
const person=(p,t)=>{const T=TENSE[t]||{};return T.persons?T.persons[p]:(T.que?'que ':'')+PERSONS[p];};

/* ---------- state ---------- */
let S=load();
const ui={view:'home',editId:null,showDropped:false,session:null,q:'',detail:null,confirm:null,restoreDraft:null};

function fresh(){return {v:1,settings:{newPerDay:15,autoSpeak:true,backupMode:'share',shortcutName:'Save Cinco Backup',voiceLang:'es-MX',theme:'auto',direction:'stage',tab:'vocab',vosotros:false},cards:{},order:[],days:{},lastBackup:null};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.cards){const f=fresh();s.settings=Object.assign(f.settings,s.settings||{});return Object.assign(f,s);}}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar. Puede que el almacenamiento esté lleno.');}}
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fecha(t){return new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'long'});}
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function dayRec(){const k=todayKey();return S.days[k]||(S.days[k]={reviewed:0,correct:0,new:0});}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function applyTheme(){
  const t=S.settings.theme||'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0E2A28':'#FFE9C9';
}
applyTheme();

/* ---------- text matching ---------- */
function norm(s){return String(s).toLowerCase().trim().replace(/[¿?¡!.,;:"“”…]/g,'').replace(/\s+/g,' ');}
function strip(s){return norm(s).replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');}
function noArticle(s){return strip(s).replace(/^(el|la|los|las|un|una|unos|unas|lo)\s+/,'');}
function alternatives(es){return es.split(/\s*[\/;]\s*|\s*\(.*?\)\s*/).map(x=>x.trim()).filter(Boolean);}
function check(input,es){
  if(!norm(input))return 'skip';
  const alts=alternatives(es);
  if(alts.some(a=>norm(a)===norm(input)))return 'exact';
  if(alts.some(a=>strip(a)===strip(input)))return 'accent';
  if(alts.some(a=>noArticle(a)===noArticle(input)))return 'article';
  return 'wrong';
}
// In a conjugation table the subject pronoun (and the subjunctive's "que") is optional: "que nosotros tengamos" counts.
function dropPronoun(t,p){
  let x=t.trim();if(/^que\s/i.test(x))x=x.replace(/^\S+\s+/,'');
  const w=norm(x).split(' ');return w.length>1&&PRONOUNS[p].includes(w[0])?x.replace(/^\S+\s+/,''):x;
}

/* ---------- speech ---------- */
// iOS quirks: getVoices() lists voices that are not downloaded (picking one gives a blip or an English
// voice mangling the Spanish), and speak() right after cancel() often produces a noise instead of speech.
// So: let iOS choose the voice from the language code alone, and only cancel when something is playing.
let speakTimer=null,currentUtterance=null,speechUnlocked=false;
// Safari's default audio session is "ambient", which plays quietly and obeys the silent switch.
// "playback" uses the full media volume, like a music or video app (Safari 16.4+).
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}

// Recorded audio. iOS speech turned out quiet or silent on the phone speaker, so words are recorded on
// the Mac by scripts/make_audio.py into audio/es-MX/<key>.m4a, where key is hash(strip(the spoken text)).
// index.json lists what exists; anything missing, or the Spain accent, falls back to iOS speech.
const REC_LANG='es-MX';
let recorded=new Set();
fetch(`audio/${REC_LANG}/index.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(a=>{recorded=new Set(a);}).catch(()=>{});
// One shared <audio> element. iOS only lets an element play after a tap has played it once;
// after that, changing its src and calling play() works from anywhere, including automatic speech.
const player=new Audio();player.setAttribute('playsinline','');player.setAttribute('x-webkit-airplay','deny');
let playerUnlocked=false,speakSeq=0;
const clips=new Map();   // key -> blob URL of recordings already played this session
function wav(rate,n,sample){
  const b=new Uint8Array(44+n*2),v=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.round(sample(i)*32767),true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
const SILENCE=wav(8000,400,()=>0);
// A short, loud three-note chime. Ajustes › Probar sonido plays it before the voice to compare volumes.
function chime(){
  const rate=22050,notes=[523.25,659.25,783.99],len=Math.round(rate*.18);
  return new Audio(wav(rate,len*notes.length,i=>{const k=i%len,env=Math.min(1,k/200)*Math.min(1,(len-k)/800);return Math.sin(2*Math.PI*notes[Math.floor(i/len)]*i/rate)*env*0.9;}));
}
function soundTest(){
  const a=chime();
  a.onended=()=>speak('Hola. ¿Me oyes bien?');
  a.play().catch(()=>speak('Hola. ¿Me oyes bien?'));
}
// iOS only allows speech and audio that start from a tap until each has been used once from a tap.
// Taps keep trying until the shared player has actually played, since iOS can refuse the first attempt.
function unlockSpeech(){
  if(!playerUnlocked&&player.paused){player.src=SILENCE;player.play().then(()=>{playerUnlocked=true;}).catch(()=>{});}
  if(speechUnlocked||!('speechSynthesis' in window))return;
  speechUnlocked=true;
  // An empty utterance is silent anyway. Don't set volume 0: iOS can carry it over to later speech.
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''));}catch(e){}
}
document.addEventListener('touchend',unlockSpeech,{passive:true});
document.addEventListener('click',unlockSpeech);
const spokenText=text=>text.replace(/\s*[\/;].*$/,'').replace(/[…]/g,'').trim();
// Each word tries its sources in order until one plays: Piper (generated on the phone, cached per word),
// then the Mac recording, then iOS speech. A newer speak() call cancels an older one still loading.
function speak(text){
  if(document.hidden)return;
  const t=spokenText(text);
  if(!t)return;
  clearTimeout(speakTimer);
  if('speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel();
  const key=hash(strip(t)),mine=++speakSeq,sources=[];
  if(piperReady())sources.push(()=>piperClip(t));
  if((S.settings.voiceLang||'es-MX')===REC_LANG&&recorded.has(key))sources.push(()=>recordingClip(key));
  player.pause();
  const next=i=>{
    if(mine!==speakSeq)return;
    if(i>=sources.length){speakSynth(t);return;}
    sources[i]().then(u=>{
      if(mine!==speakSeq)return;
      player.onerror=()=>next(i+1);player.src=u;return player.play();
    }).catch(e=>{if(!(e&&e.name==='AbortError'))next(i+1);});   // AbortError: a newer word replaced this one
  };
  next(0);
}
// Recordings are fetched whole and played from a blob: Safari plays media with range requests,
// which the service worker's cached copy can't answer.
function recordingClip(key){
  if(clips.has(key))return Promise.resolve(clips.get(key));
  return fetch(`audio/${REC_LANG}/${key}.m4a`).then(r=>{if(!r.ok)throw 0;return r.blob();})
    .then(b=>{const u=URL.createObjectURL(b);clips.set(key,u);return u;});
}

/* ---------- Piper: a neural voice that runs on the phone ---------- */
// The voice model (about 63 MB) downloads once into the phone's private storage, the engine loads in the
// background when the app opens, and each generated word is kept in the "cinco-words" cache so replays
// and offline use don't need the engine at all.
const PIPER_VOICE={'es-MX':{id:'es_MX-claude-high',name:'Claude, México'},'es-ES':{id:'es_ES-davefx-medium',name:'Davefx, España'}};
const piper={state:'idle',pct:0,voice:null,session:null,stored:[]};
let piperLib=null,piperChain=Promise.resolve();
const piperWanted=()=>PIPER_VOICE[S.settings.voiceLang||'es-MX'];
const piperReady=()=>piper.state==='ready'&&piper.voice===piperWanted().id;
function piperLoadLib(){
  return piperLib||(piperLib=import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/dist/piper-tts-web.js')
    .catch(e=>{piperLib=null;throw e;}));
}
// Which voices are saved on the phone. Only used for labels, so a storage hiccup must not break loading.
async function piperRefreshStored(){try{piper.stored=await (await piperLoadLib()).stored();}catch(e){}}
// download=false only loads a voice that is already on the phone; true downloads it if needed.
async function piperStart(download){
  const v=piperWanted().id;
  if(piper.voice===v&&(piper.state==='ready'||piper.state==='loading'))return;
  try{await piperLoadLib();await piperRefreshStored();}catch(e){if(!download)return;}
  if(!download&&!piper.stored.includes(v))return;
  Object.assign(piper,{voice:v,state:'loading',pct:0,session:null});piperPaint();
  try{
    const lib=await piperLoadLib();
    lib.TtsSession._instance=null;   // the library keeps one session; clear it so a different voice really loads
    const session=await lib.TtsSession.create({voiceId:v,progress:p=>{
      if(p.total&&String(p.url).startsWith('https://huggingface.co')){piper.pct=Math.round(100*p.loaded/p.total);piperPaint();}}});
    if(piper.voice!==v)return;       // the accent changed while this voice was loading
    piper.session=session;piper.state='ready';
    await piperRefreshStored();
  }catch(e){if(piper.voice===v)piper.state='error';piper.err=String(e&&e.message||e);console.warn('Piper',e);}
  piperPaint();
}
// Generated words are cached under made-up same-origin URLs; nothing ever fetches them from the network.
async function piperClip(t){
  const key=`${piper.voice}/${hash(strip(t))}`;
  if(clips.has(key))return clips.get(key);
  const req=new Request(new URL(`piper/${key}.wav`,location.href));
  let blob=null;
  try{const hit=await (await caches.open('cinco-words')).match(req);if(hit)blob=await hit.blob();}catch(e){}
  if(!blob){
    const session=piper.session;
    const job=piperChain.then(()=>session.predict(t));   // one word at a time through the engine
    piperChain=job.catch(()=>{});
    blob=await job;
    try{(await caches.open('cinco-words')).put(req,new Response(blob,{headers:{'content-type':'audio/wav'}}));}catch(e){}
  }
  const u=URL.createObjectURL(blob);clips.set(key,u);return u;
}
// Generate the next card's word while this one is on screen, so it plays instantly.
function piperPrefetch(){
  const s=ui.session;if(!piperReady()||!s||s.queue.length<2)return;
  const c=S.cards[s.queue[1]];if(c)setTimeout(()=>piperClip(spokenText(c.es)).catch(()=>{}),900);
}
function piperRow(){
  const w=piperWanted(),mine=piper.voice===w.id,have=piper.stored.includes(w.id);
  let sub,btn='';
  if(mine&&piper.state==='ready')sub=`Lista: ${w.name}. Las palabras suenan con esta voz y se guardan al usarlas.`;
  else if(mine&&piper.state==='loading')sub=have?'Cargando la voz…':`Descargando… ${piper.pct}%`;
  else if(mine&&piper.state==='error'){sub=`No se pudo cargar. Revisa la conexión y vuelve a intentarlo.${piper.err?` (${esc(piper.err)})`:''}`;btn='Reintentar';}
  else if(have){sub=`${w.name}, descargada. Se carga sola al abrir la app.`;btn='Cargar';}
  else{sub=`${w.name}. Suena mucho mejor que la voz del iPhone. Unos 63 MB, una sola vez: mejor con wifi.`;btn='Descargar';}
  return `<div class="setrow" id="piperRow"><div>Voz natural<small>${sub}</small></div>${btn?`<button class="tb" data-act="piperGet">${btn}</button>`:mine&&piper.state==='ready'?'<span class="tb">✓</span>':''}</div>`;
}
// Update just this row, so download progress doesn't re-render (and scroll) the whole page.
function piperPaint(){const r=document.getElementById('piperRow');if(r)r.outerHTML=piperRow();}
function speakSynth(t){
  if(!('speechSynthesis' in window))return;
  const go=()=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang=S.settings.voiceLang||'es-MX';u.rate=0.9;u.volume=1;
    currentUtterance=u;               // keep a reference so the browser cannot garbage-collect it mid-speech
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();speakTimer=setTimeout(go,180);}
  else go();
}

/* ---------- two tabs: vocabulary and conjugation ---------- */
// A verb can carry a table per tense (CSV columns presente, preterito, …, each yo|tú|él|nosotros|vosotros|ellos).
// The verb stays one vocabulary card (tener ↔ to have), and each tense it has becomes one conjugation card
// (id <verb id>:<tense>) in the Conjugación tab: the whole table is recited or typed, with its own stages per tense.
// Cards tagged "conjugation" from the first one-form-per-card deck still count as conjugation until a verb absorbs them.
const isConj=c=>c.kind==='conj'||(c.tags||'').split(/[\s,]+/).includes('conjugation');
const curTense=()=>S.settings.tense||'presente';
function inTab(c){
  if(!c)return false;
  if(S.settings.tab!=='conj')return !isConj(c);
  if(!isConj(c))return false;
  const t=curTense();
  return t==='random'||(c.kind==='conj'?c.tense===t:t==='presente');
}
const tabCards=()=>Object.values(S.cards).filter(inTab);
const newKey=()=>S.settings.tab==='conj'?'newConj':'new';   // each tab has its own daily allowance of new cards
const newRoom=()=>Math.max(0,S.settings.newPerDay-(dayRec()[newKey()]||0));
const splitForms=x=>String(x||'').split('|').map(f=>f.trim());
const tables=v=>v&&v.tenses||{};
const cardForms=c=>splitForms(tables(S.cards[c.verb])[c.tense]);
const asked=f=>[0,1,2,3,4,5].filter(p=>f[p]&&(p!==4||S.settings.vosotros));   // the persons a table asks for
function removeCard(id){delete S.cards[id];S.order=S.order.filter(x=>x!==id);}
function syncConj(v){
  // The previous version kept only the present, in v.conj,
  if(v.conj){v.tenses=Object.assign({presente:v.conj},v.tenses);delete v.conj;}
  const t=tables(v);
  // and drilled it one person per card (<verb id>.0 to .5), or as cards tagged conjugation holding one form.
  const old=[];
  for(let p=0;p<6;p++){const d=S.cards[v.id+'.'+p];if(d)old.push(d);}
  if(t.presente)for(const f of splitForms(t.presente)){const o=f&&S.cards[hash(strip(f))];if(o&&!o.kind&&isConj(o)&&!old.includes(o))old.push(o);}
  for(const T of TENSES){
    const id=v.id+':'+T.k;let d=S.cards[id];
    if(!t[T.k]){if(d)removeCard(id);continue;}
    if(d){d.es=v.es;d.en=T.name;d.tags=v.tags;continue;}
    d=S.cards[id]={id,kind:'conj',verb:v.id,tense:T.k,es:v.es,en:T.name,ex:'',notes:'',tags:v.tags,stage:0,due:0,ivl:0,reps:0,lapses:0,added:Date.now()};
    const at=T.k==='presente'?old.map(o=>S.order.indexOf(o.id)).filter(i=>i>=0).sort((a,b)=>a-b)[0]:undefined;
    if(at!=null)S.order.splice(at,0,id);else S.order.push(id);
    if(T.k==='presente'&&old.length){
      // The table starts where its weakest form was, so nothing unlearned is skipped. A vosotros drill that was
      // switched off never left stage 0, so it only counts when vosotros is being practised.
      const seen=old.filter(o=>o.p!==4||S.settings.vosotros);
      const low=(seen.length?seen:old).reduce((a,b)=>b.stage<a.stage?b:a);
      Object.assign(d,{stage:low.stage,due:low.due,ivl:low.ivl,seen:low.seen,reps:old.reduce((n,o)=>n+(o.reps||0),0),lapses:old.reduce((n,o)=>n+(o.lapses||0),0)});
      if(old.every(o=>o.dropped))d.dropped=Date.now();
    }
  }
  for(const o of old)removeCard(o.id);
}
// Brings older saves up to date (v.conj, per-person drills) and refreshes tense names on existing cards.
(function migrateConj(){
  const verbs=Object.values(S.cards).filter(c=>!c.kind&&(c.conj||c.tenses));
  if(!verbs.length)return;
  verbs.forEach(syncConj);save();
})();
// One tense as a 3×2 table, persons down the columns like a textbook. cell(p) can restyle or replace a cell.
function conjTable(f,tense,cell){
  if(!f.some(Boolean))return '';
  return `<div class="conj">${[0,1,2,3,4,5].map(p=>{
    const x=f[p]?(cell?cell(p):{}):{hide:true};
    if(x.hide)return '<div class="blank"></div>';
    return `<div class="${x.cls||''} ${p===4&&!S.settings.vosotros?'dim':''}"><small>${person(p,tense)}</small>${x.html??esc(f[p])}</div>`;}).join('')}</div>`;
}
function moreTables(v,skip,label){
  const t=tables(v);
  const h=TENSES.filter(T=>t[T.k]&&T.k!==skip).map(T=>`<p class="tname">${T.name}</p>${conjTable(splitForms(t[T.k]),T.k)}`).join('');
  return h?`<details class="more"><summary>${label}</summary>${h}</details>`:'';
}
function tabsBar(){
  const t=S.settings.tab;
  return `<div class="seg wide tabs">${[['vocab','Vocabulario'],['conj','Conjugación']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>
  ${t==='conj'?tenseSwitch():''}`;
}
// One 3-column grid: the nine indicative tenses as a 3×3 block, then the subjunctive (2×2, simple over
// compound) beside the imperative (1×2), then Aleatorio across. Tenses no verb has yet stay in place, greyed out.
function tenseSwitch(){
  const have=new Set(Object.values(S.cards).filter(c=>c.kind==='conj').map(c=>c.tense)),cur=curTense();

/* ---------- scheduling ---------- */
function counts(){
  const now=Date.now();const c={due:0,unseen:0,total:0,dropped:0,byStage:[0,0,0,0,0,0]};
  for(const k of tabCards()){if(k.dropped){c.dropped++;continue;}c.total++;c.byStage[k.stage]++;if(k.stage===0)c.unseen++;else if(k.due<=now)c.due++;}
  c.newRoom=newRoom();
  c.newToday=Math.min(c.newRoom,c.unseen);
  return c;
}
function unseenIds(){
  const ids=S.order.filter(id=>inTab(S.cards[id])&&!S.cards[id].dropped&&S.cards[id].stage===0);
  if(S.settings.tab!=='conj'||curTense()!=='random')return ids;
  // Aleatorio staggers the tenses: a verb's present comes first, and each later tense arrives three verbs further on,
  // so new cards mix tenses without one verb's six tables arriving together.
  const rank={},ti=Object.fromEntries(TENSES.map((T,i)=>[T.k,i]));let n=0;
  for(const id of S.order){const c=S.cards[id];if(c&&!c.kind&&c.tenses)rank[id]=n++;}
  const key=c=>c.tense?(rank[c.verb]??n)+ti[c.tense]*3:Infinity;
  return ids.map(id=>S.cards[id]).sort((a,b)=>key(a)-key(b)||(ti[a.tense]??9)-(ti[b.tense]??9)).map(c=>c.id);
}
function buildQueue(){
  const now=Date.now();
  const due=tabCards().filter(c=>!c.dropped&&c.stage>0&&c.due<=now+15*MIN).sort((a,b)=>a.due-b.due).map(c=>c.id);
  return [...due,...unseenIds().slice(0,newRoom())];
}
function startSession(focus){
  let q,label='';
  if(focus&&focus.stage){
    q=tabCards().filter(c=>!c.dropped&&c.stage===focus.stage).sort((a,b)=>a.due-b.due).map(c=>c.id);
    label='Etapa '+focus.stage;
    if(!q.length){toast('Aún no hay tarjetas en la etapa '+focus.stage+'.');return;}
  }else if(focus&&focus.fresh){
    q=unseenIds().slice(0,S.settings.newPerDay);
    label='Nuevas';
    if(!q.length){toast('No quedan tarjetas nuevas. Importa un CSV para añadir más.');return;}
  }else{
    q=buildQueue();
    if(!q.length){toast('No hay nada que estudiar ahora.');return;}
  }
  ui.session={queue:q,done:0,right:0,undo:null,label};
  ui.view='study';nextCard();
}
function nextCard(){
  const s=ui.session;
  // Keep the results for the done screen, which can be redrawn (after a backup, for example).
  if(!s.queue.length){ui.doneStats={done:s.done,right:s.right};ui.session=null;ui.view='done';save();render();return;}
  const c=S.cards[s.queue[0]];
  if(!c||c.dropped){s.queue.shift();return nextCard();}
  s.current=c.id;
  let mode=c.stage===0?'intro':STAGES[c.stage].mode;
  const dir=S.settings.direction||'stage';
  // A table is studied (1), recited aloud and self-graded (2–3), then typed in full (4–5).
  if(c.kind==='conj')mode=c.stage===0?'intro':c.stage>=4?'grid':'recite';
  else if(c.stage>0&&dir!=='stage'){
    // Override the stage's direction. Typing still only kicks in from stage 4, so early cards stay self-graded.
    const prod=c.stage>=4?'type':'en-es';
    mode=dir==='es-en'?'es-en':dir==='en-es'?prod:(Math.random()<0.5?'es-en':prod);
  }
  if(mode==='mixed')mode=Math.random()<0.5?'type':'es-en';
  s.mode=mode;s.phase=mode==='intro'?'intro':'prompt';s.verdict=null;s.typed='';s.cells=null;
  render();
  if(S.settings.autoSpeak&&(mode==='intro'||mode==='es-en'))speak(c.es);
  piperPrefetch();
}
function requeue(id){const q=ui.session.queue;q.splice(Math.min(q.length,RELEARN_GAP),0,id);}
function snapshot(){const s=ui.session;s.undo={card:JSON.parse(JSON.stringify(S.cards[s.current])),queue:[...s.queue],day:{...dayRec()},done:s.done,right:s.right};}
function introDone(){
  const s=ui.session,c=S.cards[s.current];snapshot();
  c.stage=1;c.ivl=0;c.due=Date.now()+10*MIN;c.seen=Date.now();const d=dayRec();d[newKey()]=(d[newKey()]||0)+1;
  s.queue.shift();requeue(c.id);save();nextCard();
}
function grade(pass){
  const s=ui.session,c=S.cards[s.current];snapshot();
  const now=Date.now(),d=dayRec();d.reviewed++;c.reps=(c.reps||0)+1;c.last=now;
  s.queue.shift();
  if(pass){
    d.correct++;s.right++;s.done++;
    if(c.stage<5){c.stage++;c.ivl=STAGES[c.stage].ivl;}else{c.ivl=Math.min(MAX_IVL,(c.ivl||21)*2);}
    c.due=c.ivl?startOfDay(now)+c.ivl*DAY:now+10*MIN;
  }else{
    c.lapses=(c.lapses||0)+1;c.stage=Math.max(1,c.stage-1);c.ivl=0;c.due=now+10*MIN;requeue(c.id);
  }
  save();nextCard();
}
function dropCard(){
  const s=ui.session,c=S.cards[s.current];snapshot();
  c.dropped=Date.now();s.queue=s.queue.filter(id=>id!==c.id);
  save();toast('Descartada. Puedes deshacerlo arriba.');nextCard();
}
function undo(){
  const s=ui.session;if(!s||!s.undo)return;
  const u=s.undo;S.cards[u.card.id]=u.card;S.days[todayKey()]=u.day;s.queue=u.queue;s.done=u.done;s.right=u.right;s.undo=null;
  save();nextCard();
}
function streak(){
  let n=0;const d=new Date();
  if(!(S.days[todayKey(d)]||{}).reviewed)d.setDate(d.getDate()-1);
  while((S.days[todayKey(d)]||{}).reviewed>0){n++;d.setDate(d.getDate()-1);}
  return n;
}

/* ---------- CSV import / export ---------- */
function parseDelimited(text){
  text=text.replace(/^﻿/,'');
  const first=text.split('\n').find(l=>l.trim()&&!l.startsWith('#'))||'';
  const delim=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f='';}
    else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(ch==='\r'){}
    else f+=ch;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim())&&!String(r[0]).startsWith('#'));
}
const ALIASES={es:['spanish','es','español','espanol','front','word','term','palabra'],en:['english','en','back','meaning','definition','translation','inglés','ingles'],ex:['example','ex','sentence','ejemplo','context'],notes:['notes','note','hint','notas'],tags:['tags','tag','category','topic'],presente:['presente','present','conjugation','conjugación','conjugacion','conj','forms','formas'],
  preterito:['preterito','pretérito','preterite'],imperfecto:['imperfecto','imperfect'],futuro:['futuro','future'],
  condicional:['condicional','conditional'],subjuntivo:['subjuntivo','subjunctive','presente de subjuntivo']};
for(const T of TENSES)if(!ALIASES[T.k])ALIASES[T.k]=[T.k,norm(T.name)];
function toRecords(rows){
  if(!rows.length)return [];
  const head=rows[0].map(h=>norm(h));
  const map={};let isHeader=false;
  for(const k in ALIASES){const i=head.findIndex(h=>ALIASES[k].includes(h));if(i>=0){map[k]=i;isHeader=true;}}
  const body=isHeader?rows.slice(1):rows;
  const idx=isHeader?{es:map.es??0,en:map.en??1,ex:map.ex,notes:map.notes,tags:map.tags}:{es:0,en:1,ex:2,notes:3,tags:4};
  TENSES.forEach((T,i)=>{idx[T.k]=isHeader?map[T.k]:5+i;});   // headerless files: the tenses follow tags, in this order
  const g=(r,i)=>i==null?'':(r[i]||'').trim();
  return body.map(r=>{
    const tenses={};for(const T of TENSES){const f=g(r,idx[T.k]);if(f)tenses[T.k]=f;}
    return {es:g(r,idx.es),en:g(r,idx.en),ex:g(r,idx.ex),notes:g(r,idx.notes),tags:g(r,idx.tags),tenses};
  });
}
function importRecords(recs){
  let added=0,updated=0,skipped=0,verbs=0;
  for(const r of recs){
    if(!r.es||!r.en){skipped++;continue;}
    const id=hash(strip(r.es));
    let c=S.cards[id];
    if(c){c.en=r.en;if(r.ex)c.ex=r.ex;if(r.notes)c.notes=r.notes;if(r.tags)c.tags=r.tags;updated++;}
    else{c=S.cards[id]={id,es:r.es,en:r.en,ex:r.ex,notes:r.notes,tags:r.tags,stage:0,due:0,ivl:0,reps:0,lapses:0,added:Date.now()};S.order.push(id);added++;}
    if(r.tenses&&Object.keys(r.tenses).length){c.tenses=Object.assign({},c.tenses,r.tenses);syncConj(c);verbs++;}
  }
  save();return {added,updated,skipped,verbs};
}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
  // Conjugation cards aren't rows of their own: they come back from the verb's tense columns.
  const lines=[['spanish','english','example','notes','tags',...TENSES.map(T=>T.k),'stage','due','reps','lapses','dropped'].join(',')];
  for(const id of S.order){const c=S.cards[id];if(!c||c.kind==='conj')continue;
    lines.push([c.es,c.en,c.ex,c.notes,c.tags,...TENSES.map(T=>tables(c)[T.k]),c.stage,c.due?todayKey(new Date(c.due)):'',c.reps||0,c.lapses||0,c.dropped?'yes':''].map(csvCell).join(','));}
  shareFile('cinco-cards-'+todayKey()+'.csv',lines.join('\n'),'text/csv');
}
async function shareFile(name,text,type){
  const blob=new Blob([text],{type});
  const file=new File([blob],name,{type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}
  }catch(e){if(e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);return true;
}
// Shortcut backups travel through the clipboard, and a large clipboard makes the Shortcut's Save File fail
// ("file doesn't exist"). With conjugation tables a backup passed 400 KB, so it goes gzipped and base64'd
// (about 60 KB), marked with PACKED. Restore and scripts/make_audio.py read both forms.
const PACKED='cinco-gz:';
async function packBackup(json){
  if(!('CompressionStream' in window))return json;
  const gz=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let bin='';for(let i=0;i<gz.length;i+=0x8000)bin+=String.fromCharCode.apply(null,gz.subarray(i,i+0x8000));
  return PACKED+btoa(bin);
}
async function unpackBackup(text){
  text=text.replace(/^\uFEFF/,'').trim();
  if(!text.startsWith(PACKED))return text;
  const bin=atob(text.slice(PACKED.length).replace(/\s+/g,''));
  return new Response(new Blob([Uint8Array.from(bin,c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function backup(){
  if(S.settings.backupMode==='shortcut'){
    // Copy the backup to the clipboard, then hand it to a Shortcut that saves it to a fixed iCloud path.
    // Safari only allows a clipboard write during the tap, so the still-compressing text goes in as a promise.
    let copied=false;
    const packed=packBackup(JSON.stringify(S));
    try{
      if(window.ClipboardItem&&navigator.clipboard.write)
        await navigator.clipboard.write([new ClipboardItem({'text/plain':packed.then(t=>new Blob([t],{type:'text/plain'}))})]);
      else await navigator.clipboard.writeText(await packed);
      copied=true;
    }catch(e){toast('No se pudo copiar. Usaremos el menú de compartir.');}
    if(copied){
      S.lastBackup=Date.now();save();
      location.href='shortcuts://run-shortcut?name='+encodeURIComponent(S.settings.shortcutName)+'&input=clipboard';
      render();
      return;
    }
  }
  const ok=await shareFile('cinco-backup-'+todayKey()+'.json',JSON.stringify(S,null,1),'application/json');
  if(ok){S.lastBackup=Date.now();save();render();}
}

function conjBody(s,c){
  const vb=S.cards[c.verb],T=TENSE[c.tense],f=cardForms(c),ps=asked(f);
  const top=k=>`<p class="k">${k}</p><div class="word">${esc(c.es)}</div><p class="notes" style="margin-top:6px">${esc(vb?vb.en:'')}</p><span class="verdict tensechip m-${T.g}">${T.name}</span>`;
  // A verb's note describes its present tense (o→ue, yo-go…), so it would mislead under any other tense.
  const notes=vb&&vb.notes&&c.tense==='presente'?`<p class="notes">${esc(vb.notes)}</p>`:'';
  const spk=`<button class="speak" data-act="speakTable" aria-label="Escucha la tabla">🔊</button>`;
  const more=moreTables(vb,c.tense,'Otros tiempos');
  // Unasked cells (vosotros, unless it's switched on) stay empty while you answer, so they don't give the stem away.
  const hideUnasked=p=>ps.includes(p)?null:{hide:true};
  const reveal=`<button class="big primary one" data-act="reveal">Mostrar la tabla</button>`;
  if(s.mode==='intro')return {body:`${top('Conjugación nueva')}${conjTable(f,c.tense)}${notes}${spk}${more}`,
    actions:`<button class="big primary one" data-act="intro">Entendido, pregúntame luego<small>Vuelve dentro de unas tarjetas</small></button>`};
  if(s.mode==='recite')return {body:top('Conjúgalo en voz alta')+(s.phase==='answer'?`<div class="answer">${conjTable(f,c.tense)}${notes}${spk}${more}</div>`:''),
    actions:s.phase==='prompt'?reveal:gradeBtns()};
  if(s.phase==='prompt')return {actions:'',body:`${top('Escribe la tabla')}<form class="gridform" data-act="checkGrid">${conjTable(f,c.tense,p=>hideUnasked(p)||{html:
    `<input id="g${p}" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="es" enterkeyhint="${p===ps[ps.length-1]?'done':'next'}" aria-label="${person(p,c.tense)}">`})}
    <button type="submit" class="big primary">Comprobar</button></form>`};
  const res=s.cells||{},right=ps.filter(p=>res[p]&&res[p].v==='exact').length;
  const near=ps.filter(p=>res[p]&&(res[p].v==='accent'||res[p].v==='article')).length;
  const tag=right===ps.length?`<span class="verdict ok">¡Todo correcto!</span>`:
    `<span class="verdict ${right+near===ps.length?'near':'no'}">${right} de ${ps.length} bien${near?`, ${near} casi (acentos)`:''}</span>`;
  const table=conjTable(f,c.tense,p=>hideUnasked(p)||(()=>{const r=res[p]||{v:'skip',typed:''};
    const cls=r.v==='exact'?'ok':r.v==='accent'||r.v==='article'?'near':'no';
    return {cls,html:esc(f[p])+(r.v==='exact'?'':`<s>${esc(r.typed)||'—'}</s>`)};})());
  return {body:`${top('Escribe la tabla')}<div class="answer">${tag}${table}${notes}${spk}${more}</div>`,actions:gradeBtns()};
}
function verdictTag(s){
  const t=esc(s.typed);
  switch(s.verdict){
    case 'exact':return `<span class="verdict ok">¡Correcto!</span>`;
    case 'accent':return `<span class="verdict near">Casi, revisa los acentos</span><p class="typed">Escribiste <s>${t}</s></p>`;
    case 'article':return `<span class="verdict near">Bien la palabra, revisa el artículo</span><p class="typed">Escribiste <s>${t}</s></p>`;
    case 'wrong':return `<span class="verdict no">No exactamente</span><p class="typed">Escribiste <s>${t}</s></p>`;
    default:return `<span class="verdict no">Sin respuesta</span>`;
  }
}

function saveCard(){
  const g=id=>document.getElementById(id).value.trim();
  const tenses={};
  for(const T of TENSES){const f=[0,1,2,3,4,5].map(p=>g(`f_${T.k}_${p}`));if(f.some(Boolean))tenses[T.k]=f.join('|');}
  const r={es:g('f_es'),en:g('f_en'),ex:g('f_ex'),notes:g('f_notes'),tags:g('f_tags').toLowerCase(),tenses};
  if(!r.es||!r.en){toast('Hacen falta el español y el inglés.');return;}
  const newId=hash(strip(r.es));
  if(ui.editId){
    const old=S.cards[ui.editId];
    const rekey=(from,to)=>{
      S.cards[to]=Object.assign(S.cards[from],{id:to});delete S.cards[from];
      S.order=S.order.map(x=>x===from?to:x);
      if(ui.session)ui.session.queue=ui.session.queue.map(x=>x===from?to:x);
    };
    if(newId!==ui.editId){
      if(S.cards[newId]){toast('Otra tarjeta ya tiene ese español.');return;}
      rekey(ui.editId,newId);
      // The verb's tense cards follow it, so a re-import of the renamed verb finds them.
      for(const T of TENSES){const d=S.cards[ui.editId+':'+T.k];if(d){rekey(d.id,newId+':'+T.k);d.verb=newId;}}
    }
    Object.assign(S.cards[newId],{es:r.es,en:r.en,ex:r.ex,notes:r.notes,tags:r.tags,tenses:r.tenses});
    syncConj(S.cards[newId]);
    save();ui.detail=newId;ui.editId=null;ui.view='browse';render();toast('Guardada');
  }else{
    if(S.cards[newId]){toast(`«${r.es}» ya está en el mazo.`);return;}
    importRecords([r]);
    toast(`Añadida: «${r.es}»`);render();          // form clears for the next card
    document.getElementById('f_es').focus();
  }
}

function howView(){
  return `${bar('Cómo funciona',back())}<div class="how">
  <h3>Cinco etapas</h3>
  <p>Cada tarjeta sube cinco etapas. Cada etapa es más difícil que la anterior y tarda más en volver. Si aciertas, la tarjeta sube (toca <b>¡La sé!</b> o desliza a la derecha). Si fallas (toca <b>Otra vez</b> o desliza a la izquierda), baja una etapa y vuelve unas tarjetas después en la misma sesión.</p>
  ${[1,2,3,4,5].map(i=>`<div class="stg">${tiles(i,'')}<div><b>${STAGES[i].name}</b><p>${STAGES[i].blurb}</p></div></div>`).join('')}
  <h3>Por qué este orden</h3>
  <p>Reconocer una palabra es más fácil que producirla, así que las primeras etapas solo te piden reconocer. En la etapa 4 ya tienes que escribirla a partir del inglés, que es lo que de verdad exige hablar. Las tarjetas que te salen fáciles se apartan rápido; las que te cuestan vuelven antes.</p>
  <h3>Elegir la dirección</h3>
  <p>Por defecto, la dirección sigue la etapa: ves el español mientras la palabra es nueva, el inglés cuando ya la conoces, y cualquiera de los dos al azar cuando está dominada. En Ajustes › Dirección puedes cambiarlo para todas las tarjetas: siempre español primero, siempre inglés primero o al azar. Escribir solo empieza en la etapa 4, así que una tarjeta temprana con el inglés primero te la calificas tú.</p>
  <h3>Practicar una etapa</h3>
  <p>En el inicio, toca cualquier columna para estudiar todas las tarjetas de esa etapa, toquen hoy o no, y toca el número de nuevas para presentar otra tanda. Se califica igual que en una sesión normal: si aciertas, la tarjeta sube y se reprograma. Sirve para una etapa que se ha acumulado o antes de un viaje; la sesión diaria es la que mantiene el ritmo.</p>
  <h3>Vocabulario y conjugación</h3>
  <p>Arriba del inicio eliges entre dos mazos. Cada uno tiene sus propias etapas, sus repasos y su límite de nuevas por día, así que puedes dedicar una sesión a palabras y otra a verbos.</p>
  <p>Un verbo sale una sola vez en <b>Vocabulario</b> (<i>tener</i> ↔ <i>to have</i>); al ver la respuesta puedes abrir todas sus tablas. En <b>Conjugación</b> cada tiempo de cada verbo es una tarjeta: ves <b>tener · Pretérito</b> y conjugas la tabla entera. Primero la estudias, luego la dices en voz alta y te calificas, y desde la etapa 4 escribes las seis formas. Si todas están bien, sube sola; si no, ves cuáles fallaste y decides tú. El pronombre es opcional: <i>nosotros tuvimos</i> también vale.</p>
  <p>Debajo de las pestañas eliges el tiempo, agrupado en indicativo, subjuntivo e imperativo; solo aparecen los tiempos que tienen tus verbos. En el imperativo no hay forma de yo, así que se piden tú, usted, nosotros, vosotros y ustedes. Cada tiempo lleva su propio progreso, así que dominar <i>tener</i> en presente no lo da por sabido en pretérito. <b>Aleatorio</b> mezcla todos los tiempos en la misma sesión y te dice cuál toca en cada tarjeta.</p>
  <p>Las formas de vosotros aparecen en la tabla, pero solo se piden si activas <b>Ajustes › Practicar vosotros</b>.</p>
  <h3>Descartar palabras</h3>
  <p>Si una palabra no te merece la pena, toca <b>Descartar esta palabra</b> debajo de la tarjeta. No vuelve a programarse y sigue descartada aunque reimportes el CSV de donde vino. Deshacer la devuelve al momento; más tarde, búscala en Explorar tarjetas › Descartadas y toca <b>Recuperar</b>.</p>
  <h3>El ritmo diario</h3>
  <p>Abre la app una vez al día. Primero van los repasos y después las nuevas, hasta tu límite diario. Una sesión de 30 tarjetas dura unos cinco minutos.</p>
  <h3>La voz</h3>
  <p>La voz del iPhone suena muy baja, así que Cinco usa una voz natural que se genera en el propio teléfono. Descárgala una vez en <b>Ajustes › Voz natural</b> (unos 63 MB, mejor con wifi). Cada palabra se genera la primera vez que suena y se guarda, así que después suena al instante y sin conexión, también las que añades a mano.</p>
  <p>Hasta que la descargues, las palabras suenan con grabaciones hechas en el Mac y, si no hay grabación, con la voz del iPhone. Si cambias el acento a España, esa voz se descarga aparte.</p>
  <h3>Tus datos</h3>
  <p>Las tarjetas y el progreso se guardan en este teléfono. Importa mazos en CSV desde iCloud Drive. Toca <b>Guardar copia de seguridad</b> para guardar un archivo que puedas restaurar más tarde.</p>
  <p>Columnas del CSV: <code>spanish,english,example,notes,tags</code>. Solo las dos primeras son obligatorias. Los verbos pueden llevar una columna por tiempo (<code>presente</code>, <code>preterito</code>, <code>imperfecto</code>, <code>futuro</code>, <code>condicional</code>, <code>subjuntivo</code>, <code>subj_imperfecto</code>, <code>imperativo</code>, <code>imperativo_negativo</code>, <code>perfecto</code>, <code>pluscuamperfecto</code>, <code>futuro_perfecto</code>, <code>condicional_perfecto</code>, <code>subj_perfecto</code>, <code>subj_pluscuamperfecto</code>), cada una con las seis formas separadas por <code>|</code>: <code>tengo|tienes|tiene|tenemos|tenéis|tienen</code>. Reimportar un archivo actualiza las tarjetas que ya existen sin perder su progreso; se emparejan por el texto en español.</p>
  <p>Si en la columna del español separas alternativas con <code>/</code>, todas valen al escribir, por ejemplo <code>el coche / el carro</code>.</p>
  <h3>Copias de un toque con un Atajo</h3>
  <p>Safari no puede escribir en una carpeta por su cuenta, así que la copia normal pasa por el menú de compartir. Un Atajo se salta ese paso: Cinco copia tu progreso y le pide al Atajo que lo guarde siempre en el mismo archivo.</p>
  <p>Se configura una vez, en la app Atajos. Los nombres de las acciones aparecen tal como los muestra tu iPhone:</p>
  <p>1. Toca + para crear un atajo nuevo. Llámalo exactamente <code>Save Cinco Backup</code>.</p>
  <p>2. Añade la acción <b>Save File</b> (Guardar archivo). Pon como entrada <b>Shortcut Input</b> (Entrada del atajo).</p>
  <p>3. En esa acción, desactiva <b>Ask Where to Save</b>, activa <b>Overwrite If File Exists</b> y pon como ruta <code>Spanish/backups/cinco-backup.json</code>.</p>
  <p>4. De vuelta en Cinco, activa <b>Copia con un Atajo</b> en Ajustes.</p>
  <p>Ahora <b>Guardar copia de seguridad</b> copia tu progreso y abre el Atajo, que lo guarda en iCloud Drive › Shortcuts › Spanish › backups. Después vuelve a Cinco. Para restaurar, usa <b>Restaurar una copia</b> y elige ese archivo.</p>
  </div>`;
}

/* ---------- render + events ---------- */
const app=document.getElementById('app');
function render(){
  const v=ui.view;
  app.innerHTML=v==='study'?studyView():v==='done'?doneView():v==='browse'?browseView():v==='settings'?settingsView():v==='edit'?editView():v==='how'?howView():v==='restore'?restoreView():homeView();
  const inp=document.getElementById('ans')||document.querySelector('.gridform input')||document.getElementById('f_es');if(inp&&!inp.value){inp.focus();}
  const sc=document.getElementById('scName');if(sc){sc.onchange=()=>{S.settings.shortcutName=sc.value.trim()||'Save Cinco Backup';save();};}
  const q=document.getElementById('q');if(q){q.oninput=()=>{ui.q=q.value;const pos=q.selectionStart;render();const nq=document.getElementById('q');nq.focus();nq.setSelectionRange(pos,pos);};}
  window.scrollTo(0,0);
}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

app.addEventListener('submit',e=>{
  const sf=e.target.closest('[data-act="saveCard"]');if(sf){e.preventDefault();saveCard();return;}
  const gf=e.target.closest('[data-act="checkGrid"]');
  if(gf){
    e.preventDefault();const s=ui.session,c=S.cards[s.current],f=cardForms(c);
    s.cells={};for(const p of asked(f)){const typed=(document.getElementById('g'+p)||{}).value||'';s.cells[p]={typed,v:check(dropPronoun(typed,p),f[p])};}
    s.phase='answer';const all=Object.values(s.cells).every(x=>x.v==='exact');s.verdict=all?'exact':'wrong';render();
    if(all)setTimeout(()=>{if(ui.view==='study'&&ui.session&&ui.session.current===c.id&&ui.session.phase==='answer')grade(true);},1200);
    return;
  }
  const f=e.target.closest('[data-act="check"]');if(!f)return;e.preventDefault();
  const s=ui.session,c=S.cards[s.current];s.typed=document.getElementById('ans').value;
  s.verdict=check(s.typed,c.es);s.phase='answer';render();
  if(S.settings.autoSpeak)speak(c.es);
  if(s.verdict==='exact')setTimeout(()=>{if(ui.view==='study'&&ui.session&&ui.session.current===c.id&&ui.session.phase==='answer')grade(true);},900);
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='FORM')return;
  const act=b.dataset.act;
  if(act!=='resetCard'&&act!=='deleteCard'&&act!=='erase')ui.confirm=null;
  switch(act){
    case 'go':ui.view=b.dataset.v;ui.detail=null;if(b.dataset.v==='home'&&ui.session&&!ui.session.queue.length)ui.session=null;render();break;
    case 'stage':startSession({stage:+b.dataset.s});break;
    case 'fresh':startSession({fresh:true});break;
    case 'study':if(ui.session&&ui.session.queue.length){ui.view='study';nextCard();}else startSession();break;
    case 'import':fileCsv.click();break;
    case 'restore':fileJson.click();break;
    case 'restoreGo':S=Object.assign(fresh(),ui.restoreDraft);ui.restoreDraft=null;ui.session=null;save();ui.view='home';render();toast('Restaurado');break;
    case 'backup':backup();break;
    case 'exportCsv':exportCsv();break;
    case 'intro':introDone();break;
    case 'reveal':{const s=ui.session,c=S.cards[s.current];s.phase='answer';render();if(S.settings.autoSpeak&&s.mode==='en-es')speak(c.es);break;}
    case 'grade':grade(b.dataset.p==='1');break;
    case 'undo':undo();break;
    case 'drop':dropCard();break;
    case 'speak':speak(S.cards[ui.session.current].es);break;
    case 'speakId':speak(S.cards[b.dataset.id].es);break;
    case 'speakTable':{const c=S.cards[b.dataset.id||ui.session.current];speak(asked(cardForms(c)).map(p=>cardForms(c)[p].split('/')[0].trim()).join(', '));break;}
    case 'tense':if(curTense()!==b.dataset.t){S.settings.tense=b.dataset.t;ui.session=null;save();}render();break;
    case 'showDropped':ui.showDropped=b.dataset.v==='dropped';render();break;
    case 'detail':ui.detail=b.dataset.id||null;ui.view='browse';render();break;
    case 'edit':ui.editId=b.dataset.id||null;ui.view='edit';render();break;
    case 'npd':S.settings.newPerDay=Math.max(5,Math.min(60,S.settings.newPerDay+ +b.dataset.d));save();render();break;
    case 'tab':if(S.settings.tab!==b.dataset.t){S.settings.tab=b.dataset.t;ui.session=null;ui.q='';save();}render();break;
    case 'toggleVos':S.settings.vosotros=!S.settings.vosotros;save();render();break;
    case 'toggleSpeak':S.settings.autoSpeak=!S.settings.autoSpeak;save();render();break;
    case 'soundTest':soundTest();break;
    case 'piperGet':piperStart(true);break;
    case 'accent':S.settings.voiceLang=S.settings.voiceLang==='es-ES'?'es-MX':'es-ES';save();render();speak('Hola, ¿cómo estás?');piperStart(false);break;
    case 'theme':S.settings.theme=b.dataset.t;save();applyTheme();render();break;
    case 'direction':S.settings.direction=b.dataset.d;save();render();break;
    case 'toggleBackup':S.settings.backupMode=S.settings.backupMode==='shortcut'?'share':'shortcut';save();render();break;
    case 'toggleDrop':{const c=S.cards[b.dataset.id];if(c.dropped)delete c.dropped;else c.dropped=Date.now();save();render();toast(c.dropped?'Descartada':'De vuelta al mazo');break;}
    case 'resetCard':if(ui.confirm!=='reset'){ui.confirm='reset';render();break;}
      {const c=S.cards[b.dataset.id];Object.assign(c,{stage:0,due:0,ivl:0,reps:0,lapses:0});ui.confirm=null;save();render();toast('Progreso reiniciado');}break;
    case 'deleteCard':if(ui.confirm!=='delete'){ui.confirm='delete';render();break;}
      {const gone=new Set([b.dataset.id]);for(const id in S.cards)if(S.cards[id].verb===b.dataset.id)gone.add(id);   // a verb takes its drills with it
      for(const id of gone)delete S.cards[id];S.order=S.order.filter(x=>!gone.has(x));}ui.detail=null;ui.confirm=null;save();render();toast('Tarjeta borrada');break;
    case 'erase':if(ui.confirm!=='erase'){ui.confirm='erase';render();break;}
      S=fresh();ui.session=null;ui.confirm=null;save();ui.view='home';render();toast('Todo borrado');break;
  }
});

// In a table being typed, Enter (or the keyboard's Next) moves on to the next person; the last one checks.
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.closest('.gridform'))return;
  const ins=[...document.querySelectorAll('.gridform input')],i=ins.indexOf(e.target);
  if(i>=0&&i<ins.length-1){e.preventDefault();ins[i+1].focus();}
});

/* swipe to grade: right = got it, left = again */
let drag=null,swipedAt=0;
app.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card.swipe');if(!card||drag||(e.pointerType==='mouse'&&e.button!==0))return;
  drag={card,id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,on:false,yes:card.querySelector('.stamp.yes'),no:card.querySelector('.stamp.no')};
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(Math.abs(dy)>Math.abs(dx)){drag=null;return;} // vertical: let the page scroll
    drag.on=true;drag.card.classList.add('dragging');drag.card.setPointerCapture(e.pointerId);
  }
  drag.dx=dx;
  drag.card.style.transition='none';
  drag.card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
  const t=Math.min(1,Math.abs(dx)/100);
  drag.yes.style.opacity=dx>0?t:0;drag.no.style.opacity=dx<0?t:0;
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;if(!d.on)return;
  swipedAt=Date.now();
  d.card.classList.remove('dragging');
  const pass=d.dx>0,far=Math.abs(d.dx)>Math.min(110,d.card.offsetWidth*.3);
  if(e.type==='pointerup'&&far){
    const id=ui.session.current;
    d.card.style.transition='transform .22s ease-in';
    d.card.style.transform=`translateX(${(pass?1:-1)*window.innerWidth*1.3}px) rotate(${pass?25:-25}deg)`;
    setTimeout(()=>{if(ui.view==='study'&&ui.session&&ui.session.current===id&&ui.session.phase==='answer')grade(pass);},200);
  }else{
    d.card.style.transition='transform .2s ease-out';d.card.style.transform='';
    d.yes.style.opacity=d.no.style.opacity=0;
  }
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);
// A drag that ends over the speak button shouldn't also play audio.
app.addEventListener('click',e=>{if(Date.now()-swipedAt<400)e.stopImmediatePropagation();},true);

render();
setTimeout(()=>piperStart(false),1200);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){player.pause();return;}
  if('speechSynthesis' in window)speechSynthesis.resume();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
